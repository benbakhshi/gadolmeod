# Gadol Meod Inc — Real Estate Registry (source of truth)
#
# This file is the human-editable registry. Running `gmre seed` (or starting the
# app for the first time) loads it into the database. Edit it, commit it, re-seed.
#
# Financial figures (rents, prices, NOI) are intentionally LEFT BLANK where not
# independently known. Populate them here, or import via `gmre import-leases` /
# `gmre import-financials` (CSV), or wire up the QuickBooks sync. Do not guess.
#
# Fields marked `null` are unknown and should be filled in.

entities:
  - id: gadol-meod-inc
    name: Gadol Meod Inc
    type: C-Corp
    role: holding
    notes: >-
      Parent C corporation. Value-add and hold of industrial real estate and
      publicly traded securities of quality, growing companies.

  - id: herzl-capital-llc
    name: Herzl Capital LLC
    type: LLC
    role: asset_manager
    notes: Asset manager / management company.

  - id: herzl-real-estate-llc
    name: Herzl Real Estate LLC
    type: LLC
    role: holding
    notes: Real estate holding entity (e.g., Jeannette Warehouse).

  - id: tikva-investment-lp
    name: Tikva Investment LP
    type: LP
    role: fund
    notes: Private investment partnership (securities).

  - id: cuttlefish-real-estate-llc
